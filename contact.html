<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>Contato | Samuel A.</title>

    <!-- CSS -->
    <link rel="stylesheet" href="contact.css">
  </head>

  <body>

    <!-- Navegação -->
    <div class="nav-home">
      <a href="index.html">Home</a>
    </div>

    <!-- Centralizador -->
    <div class="form-wrapper">
      <form method="post" action="https://n8n.samuel-workflows.space/webhook/contato">
        
        <div>
          <label for="fname">Nome:</label>
          <input type="text" id="fname" name="fname">
        </div>

        <div>
          <label for="femail">Email:</label>
          <input type="text" id="femail" name="femail">
        </div>

        <div>
          <label for="finquiry">Motivo do contato:</label>
          <textarea id="finquiry" name="finquiry"></textarea>
        </div>

        <div>
          <input type="submit" value="Enviar">
        </div>

      </form>
    </div>

  </body>
</html>
